name: nexabank

# Settings for the app and agents live in .env (Groq key, AUTHZ_MODE, FGA_*).
# After editing .env run:  docker compose up -d     (only changed containers restart)

x-workload: &workload
  build: ./app
  env_file: .env
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- prebuilt: human identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180          # the URL browsers use; tokens are issued for it
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"     # containers may still call http://keycloak:8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"   # login pages + admin console (admin / admin)

  # ---------------------------------------------------------------- prebuilt: workload identity
  spire-server:
    build: ./spire
    command: sh /spire/server.sh
    volumes:
      - spire-shared:/shared
      - spire-server-data:/var/lib/spire/server
      - spire-server-socket:/tmp/spire-server/private   # admin socket, shared only with the SPIRE Agent
    restart: unless-stopped

  spire-agent:
    build: ./spire
    command: sh /spire/agent.sh
    pid: host                                     # to see which process is calling the Workload API
    volumes:
      - spire-server-socket:/run/spire/server     # to fetch a fresh join token on every start
      - spire-sockets:/run/spire/sockets
      - /var/run/docker.sock:/var/run/docker.sock # to read the caller's container labels (docker attestor)
    depends_on: [spire-server]
    restart: unless-stopped                       # crashed (e.g. after a laptop sleep)? Docker restarts it; it re-attests

  # ---------------------------------------------------------------- the bank application
  fraud-ops:
    <<: *workload
    command: python -u server.py
    labels:
      ai.service: fraud-ops                       # SPIRE gives this container spiffe://ai-governance.demo/service/fraud-ops
    volumes:
      - spire-sockets:/run/spire/sockets
      - spire-shared:/shared:ro
      - app-data:/data
    ports:
      - "8000:8000"   # NexaBank Fraud Ops for people (Keycloak login)
    depends_on: [spire-agent, keycloak]

  # ---------------------------------------------------------------- AI agents (Groq LLM)
  agent-orchestrator:
    <<: *workload
    command: python -u agents.py
    environment: { AGENT_NAME: orchestrator }
    labels: { ai.agent: orchestrator }
    volumes: [ "spire-sockets:/run/spire/sockets" ]
    depends_on: [spire-agent]

  agent-research:
    <<: *workload
    command: python -u agents.py
    environment: { AGENT_NAME: research }
    labels: { ai.agent: research }
    volumes: [ "spire-sockets:/run/spire/sockets" ]
    depends_on: [spire-agent]

  agent-payment:
    <<: *workload
    command: python -u agents.py
    environment: { AGENT_NAME: payment }
    labels: { ai.agent: payment }
    volumes: [ "spire-sockets:/run/spire/sockets" ]
    depends_on: [spire-agent]

  agent-fake:
    <<: *workload
    command: python -u agents.py
    environment: { AGENT_NAME: fake }
    labels: { ai.agent: fake }
    volumes: [ "spire-sockets:/run/spire/sockets" ]
    depends_on: [spire-agent]

  # ---------------------------------------------------------------- OpenFGA: NOT prebuilt
  # You start these in class:   docker compose --profile openfga up -d
  openfga-db:
    image: postgres:17-alpine
    profiles: [openfga]
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    volumes:
      - openfga-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga"]
      interval: 3s
      retries: 20

  openfga-migrate:
    image: openfga/openfga:v1.21.0
    profiles: [openfga]
    command: migrate
    environment: &openfga-db
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db: { condition: service_healthy }

  openfga:
    image: openfga/openfga:v1.21.0
    profiles: [openfga]
    command: run --http-addr 0.0.0.0:8090
    environment: *openfga-db
    ports:
      - "8090:8090"   # OpenFGA HTTP API (also used by the Playground at play.fga.dev)
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # The OpenFGA CLI, run on demand:   docker compose run --rm fga <command>
  fga:
    image: openfga/cli:v0.8.1
    profiles: [tools]
    environment:
      FGA_API_URL: http://openfga:8090
      FGA_STORE_ID: ${FGA_STORE_ID:-}
      FGA_MODEL_ID: ${FGA_MODEL_ID:-}
    volumes:
      - ./openfga:/work
    working_dir: /work

volumes:
  spire-shared:
  spire-server-data:
  spire-server-socket:
  spire-sockets:
  app-data:
  openfga-db:
