agent {
  data_dir = "/var/lib/spire/agent"
  log_level = "WARN"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/sockets/agent.sock"
  trust_bundle_path = "/var/lib/spire/agent/bootstrap-bundle.pem"
  trust_domain = "ai-governance.demo"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "memory" {
    plugin_data {}
  }
  # Identifies the calling workload by its Docker container labels
  WorkloadAttestor "docker" {
    plugin_data {}
  }
}
